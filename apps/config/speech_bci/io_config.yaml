# Speech BCI Decoder Demo IO Configuration

input_devices:
  - input_device_name: "speech_bci"
    input_device_type: "bci"
    input_device_class: "speech_bci_input"
    input_device_parameters:
      dataset_path: "/home/raymonddunn/data/speechBCI/ptDecoder_ctc"
      partition: "test"
      # decoder_mode: "local"  # "local" (shared memory subprocess) or "cloud" (WebSocket)
      decoder_mode: "cloud"
      decoder_url: "ws://localhost:8765/ws"  # used when decoder_mode is "cloud"
      decoder_python: "/home/raymonddunn/miniconda3/envs/speech/bin/python"
      playback_rate_hz: 50
      inter_trial_pause_s: 3.0
      decode_interval_bins: 30
      min_decode_bins: 32
      decoder_load_timeout_s: 300 # for local model

output_devices:
  - output_device_name: "speech_bci_control"
    output_device_type: "bci"
    output_device_class: "speech_bci_output"
    output_device_parameters:
      linked_input_device: "speech_bci"
