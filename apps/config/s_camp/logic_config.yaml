# Physical Hardware Demo Logic Configuration
# Brainalyzer interactive GUI for closed-loop microscopy

logic_algorithms:
  - logic_algorithm_name: "brainalyzer"
    logic_class: "brainalyzer_logic"
    logic_parameters:
      gui_mode: "neural_imaging"
      stim_intensity: 0
      save_dir: "./output"
      calibration_file: "apps/io/output_device/res/MightexPolygon1000/calibrations.json"
      default_light_source: "ldi-470"
      light_sources:
        - name: "ldi-470"
          intensity_type: "int"
          intensity_min: 0
          intensity_max: 100
          units: "%"
        - name: "ldi-450"
          intensity_type: "int"
          intensity_min: 0
          intensity_max: 100
          units: "%"
        - name: "widefield_488"
          intensity_type: "float"
          intensity_min: 0.0
          intensity_max: 3.5
          units: "V"
    io_parameters:
      output_device_names: ["polygon", "ldi-470", "ldi-450", "widefield_488"]
      input_device_names: ["camera"]
    gui_parameters:
      gui_screenshot_freq: 0
