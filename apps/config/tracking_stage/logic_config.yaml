# XY Tracking Stage Logic Configuration
# Centroid-based stage tracking via GUI subprocess

logic_algorithms:
  - logic_algorithm_name: "xy_tracking"
    logic_class: "xy_tracking_logic"
    logic_parameters:
      input_device_name: "camera"
      stage_output_name: "xy_stage_output"
      micron_to_pix_ratio: 0.815       # um/pixel at current binning; refine in calibration mode
      stage_dampening_factor: 0.25     # 0-1, fraction of the error corrected per frame
      threshold_frac: 0.5              # blob threshold = mean + frac*(max-mean)
      deadband_px: 0.0                 # correct every frame (0 = keep as centered as possible)
      min_puncta_snr: 6.0              # peak SNR to accept a puncta; below this, hold still
      centroid_smoothing: 0.0          # 0-0.95 EMA on the centroid (noise rejection)
      max_step_um: 200.0               # clamp per correction (rejects outliers)
      # Stage/camera orientation. Defaults below match a stage rotated 90 deg vs
      # the camera; verify with the D-pad (Up moves up) and adjust if your rig
      # differs. Jog and tracking share this mapping, so a correct D-pad = correct
      # tracking signs.
      swap_axes: true                  # vertical error -> axis1, horizontal -> axis0
      invert_axis0: false              # flip physical stage axis0 sign (set from rig test)
      invert_axis1: true               # flip physical stage axis1 sign (set from rig test)
      enable_axis0: true               # allow tracking to drive axis0
      enable_axis1: true               # allow tracking to drive axis1
      roi_radius_px: 30                # fluorescence extraction circle radius
      jog_step_um: 50                  # manual jog D-pad step
      cal_step_um: 100                 # stage step used to measure um/pixel
      cal_settle_frames: 8             # frames to wait for the move to settle
      ratio_increment: 0.02            # +/- nudge for um/pixel
      save_dir: "D:/shen lab/20260818/"  # fluorescence trace output dir
    io_parameters:
      output_device_names: ["xy_stage_output"]
      input_device_names: ["camera"]
    gui_parameters:
      gui_screenshot_freq: 0
