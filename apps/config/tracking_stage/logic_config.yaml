# XY Tracking Stage Logic Configuration
# Centroid-based stage tracking via GUI subprocess

logic_algorithms:
  - logic_algorithm_name: "xy_tracking"
    logic_class: "xy_tracking_logic"
    logic_parameters:
      input_device_name: "camera"
      stage_output_name: "xy_stage_output"
      micron_to_pix_ratio: 0.815       # um/pixel at current binning; refine in calibration mode
      threshold_frac: 0.5              # blob threshold = mean + frac*(max-mean)

      # Control algorithm. All three see the same error and drive the same
      # command path, so they can be switched live from the GUI to compare them
      # on the RMS centering error shown in the status bar.
      #   proportional - corrects a fraction of the current error. Trails a
      #                  steadily drifting target by a fixed offset.
      #   pid          - adds an integral term that walks that offset out.
      #   kalman       - estimates the target's velocity and commands where it
      #                  will be once the stage gets there.
      tracking_algorithm: "kalman"
      proportional:
        kp: 0.25                       # fraction of the error corrected per frame
      pid:
        kp: 0.4
        ki: 0.8                        # 1/s; removes the standing drift offset
        kd: 0.0                        # s; the centroid is noisy, leave at 0 first
        d_tau_s: 0.1                   # derivative low-pass time constant
        i_limit_um: 100.0              # integral clamp (anti-windup)
      kalman:
        kp: 0.9                        # fraction of the predicted error commanded
        horizon_ms: 20.0               # ~1 frame at 50 fps. TUNE ON THE RIG: raise while
                                       # the RMS error readout falls, back off once it
                                       # climbs. It covers only the lag that is not
                                       # already accounted for, so it is much shorter
                                       # than the capture->apply latency in the status
                                       # bar - do not calculate it from that. Under-set
                                       # is gentle, over-set makes the loop lead the
                                       # target and is worse than leaving it at 0.
        # q_accel and r_meas_um act as a ratio (q / r^2): high tracks an agile target
        # but passes centroid noise through, low is smooth but lags direction changes.
        q_accel: 400.0                 # um^2/s^3; raise for a more agile target
        r_meas_um: 2.0                 # centroid noise; raise this first if the blob is
                                       # dim and the centroid jitters
      reset_after_lost_frames: 25      # ~0.5 s at 50 fps before the estimate is discarded

      # Fluorescence excitation, switched by the worker's record button so the
      # target can be found under brightfield before it starts moving fast.
      light_output_name: "fluorescence_light"
      acquisition_intensity: 100       # level while recording (live in the GUI)
      idle_intensity: 0                # level the rest of the time
      deadband_px: 0.0                 # correct every frame (0 = keep as centered as possible)
      # Leave at 0 with the Kalman filter: the EMA adds s/(1-s) frames of lag on
      # top of the dead time the filter is already compensating for.
      min_puncta_snr: 6.0              # peak SNR to accept a puncta; below this, hold still
      centroid_smoothing: 0.0          # 0-0.95 EMA on the centroid (noise rejection)
      max_step_um: 200.0               # clamp per correction (rejects outliers)
      # Stage/camera orientation. Defaults below match a stage rotated 90 deg vs
      # the camera; verify with the D-pad (Up moves up) and adjust if your rig
      # differs. Jog and tracking share this mapping, so a correct D-pad = correct
      # tracking signs.
      swap_axes: true                  # vertical error -> axis1, horizontal -> axis0
      invert_axis0: false              # flip physical stage axis0 sign (set from rig test)
      invert_axis1: true               # flip physical stage axis1 sign (set from rig test)
      enable_axis0: true               # allow tracking to drive axis0
      enable_axis1: true               # allow tracking to drive axis1
      roi_radius_px: 30                # fluorescence extraction circle radius
      jog_step_um: 50                  # manual jog D-pad step
      cal_step_um: 100                 # stage step used to measure um/pixel
      cal_settle_frames: 20            # frames to wait for the move to settle (~0.4 s at 50 fps)
      ratio_increment: 0.02            # +/- nudge for um/pixel
      save_dir: "D:/shen lab/20260818/"  # fluorescence trace output dir
    io_parameters:
      output_device_names: ["xy_stage_output", "fluorescence_light"]
      input_device_names: ["camera"]
    gui_parameters:
      gui_screenshot_freq: 0
