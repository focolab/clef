# XY Tracking Stage IO Configuration
# Camera input + XY stage position tracking + stage correction output

input_devices:
  - input_device_name: "camera"
    input_device_type: "camera"
    input_device_class: "micromanager_camera"
    data_interface_class: "shm_uint16_data_interface"
    data_interface_parameters:
      shm_buffer_size: 4   # frame ring slots, NOT z-planes: successive frames go to
                           # successive segments (image_count % size). At 1 the camera
                           # writes the same buffer the tracking worker is reading, so
                           # the worker can pick up a half-copied frame and compute a
                           # garbage centroid. Any value > 1 separates them.
      shm_name_prefix: "shared_frame_memory"
    input_device_parameters:
      device_properties: null
      use_strobed_acquisition: false
      strobe_inter_frame_interval_ms: 100.0
      drop_to_latest: true   # always process newest frame; drop stale backlog
      report_timing: true    # log loop fps + buffer backlog (~1 Hz)
      capture_frame_metadata: true  # per-frame sensor timestamp into event log;
                                    # watch the first [frame metadata] log line —
                                    # set false if the pull is slow on this rig

  - input_device_name: "xy_stage"
    input_device_type: "stage"
    input_device_class: "xy_tracking_stage_input"
    data_interface_class: "base_data_interface"
    input_device_parameters:
      xy_stage_device: null  # auto-detect from Micro-Manager
      poll_interval_frames: 50  # metadata only; reading position stalls the loop.
                                # ~1 s at 50 fps - a serial position query can eat
                                # most of a 20 ms frame budget, so keep it rare.

output_devices:
  # Fluorescence excitation. Driven by the worker's record button, not per
  # sample: the target is found under brightfield with this at 0, because it
  # moves faster once the excitation is on.
  - output_device_name: "fluorescence_light"
    output_device_type: "lightsource"
    output_device_class: "ldi_89north"
    output_device_parameters:
      intensity_device: null   # auto-detect: the loaded device carrying the
                               # property below. Set a label here to override.
      intensity_property: "LightEngineIntensity"
      shutter_device: null     # brightfield/shutter is handled manually at the scope

  - output_device_name: "xy_stage_output"
    output_device_type: "stage"
    output_device_class: "xy_tracking_stage_output"
    output_device_parameters:
      shm_name: "shared_stage_offset_xy"
