# Limit Cycle Demo Logic Configuration

logic_algorithms:
  - logic_algorithm_name: "limit_cycle"
    logic_class: "limit_cycle_logic"
    logic_parameters:
      visualize_real_time: true
      fading_trajectory_samples: 100
      stim_cooldown_frames: 50
      inner_radius: 6.0
      outer_radius: 10.0
      image_width: 100
      image_height: 100
      save_dir: "./demo_output/limit_cycle"
    io_parameters:
      output_device_names:
        - "ring_stimulus"
      input_device_names:
        - "ring_camera"
    gui_parameters:
      enable_gui: false
      gui_mode: "neural_imaging"
      save_algorithm_plot: true
      gui_screenshot_freq: 0
