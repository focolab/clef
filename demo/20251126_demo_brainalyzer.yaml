# Brainalyzer Demo Configuration
# This config file can be loaded instead of creating configs programmatically

# Hardware configuration
hardware:
  backend: "dummy"
  stim_interface: "dummy"
  microscope_name: "demo_microscope"
  strobe_acquisition: false
  strobe_inter_frame_interval_ms: 80
  use_static_stim_roi: false

# Experiment configuration
experiment:
  experiment_name: "brainalyzer_demo"
  experimenter: "Demo User"
  output_dir: "./demo_output"
  save_images: true
  save_metadata: true
  save_mip_video: false
  
  # Path to input TIFF file (required for dummy backend)
  input_recording_path: "./demo_data/sample_recording.tiff"
  
  # Acquisition parameters
  acquisition:
    num_frames: 100
    frame_rate: null
    z_stack: true
    z_planes: 10
    z_start: 0.0
    z_end: 9.0
    z_step: 1.0
    baseline_frames: 10
    save_structural_scan: "none"
  
  # Subject metadata
  subject:
    subject_id: "demo_001"
    subject_type: "C. elegans"
    genotype: "demo_strain"
    treatment: "none"
    notes: "Interactive Brainalyzer demo with GUI"
  
  # Dev options
  dev_options:
    prefill_wb_ops: false
    send_sms_on_completion: false

# Algorithm configuration
algorithm:
  algorithm_type: "Brainalyzer"
  enable_gui: true
  gui_mode: "neural_imaging"  # Options: neural_imaging, behavior
  save_algorithm_plot: true
  
  # Algorithm parameters
  algorithm_params:
    stim_cooldown_frames: 50  # Short cooldown for demo
    skip_stimulation_probability: 0.0
    delay_stimulation_probability: 0.0
    stim_delay_frames_options: [10, 20]
    stim_onset_list: []
    stimulus_diameter_pixels: 30
  
  # Stimulus parameters
  stimulus_params:
    enabled: true
    randomize: false
    duration_frames_options: [20, 40]  # 2-4 volumes
    intensity_percent_options: [10, 20, 30]
    duration_frames: 20
    intensity_percent: 10