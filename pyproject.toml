[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clef"
version = "1.0.0"
description = "Closed-Loop Experimental Framework for real-time microscopy and stimulus control"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Raymond Dunn", email = "ray.l.dunn@gmail.com"}
]
keywords = ["neuroscience", "microscopy", "closed-loop", "calcium-imaging", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Core dependencies
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
demos = [
    "scipy>=1.11",
    "tifffile>=2023.7.0",
    "pyqtgraph>=0.13",
    "pyside6>=6.5",
    "pyopengl>=3.1",
    "matplotlib>=3.7",
    "pyopengl-accelerate>=3.1",
]

all = [
    "clef[demos]",
    "pytest>=7.0",
    "pycromanager>=0.45",
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "numba>=0.57",
]

[project.scripts]
clef = "core.utils.clef_cli:main"

[project.urls]
Homepage = "https://github.com/focolab/clef"
Repository = "https://github.com/focolab/clef"
Issues = "https://github.com/focolab/clef/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "apps*", "demo*", "utils*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.yml", "**/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
