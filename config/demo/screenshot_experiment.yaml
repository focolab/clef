# ========================================
# screenshot_experiment.yaml
# ========================================
experiment_name: "screenshot_demo"
experimenter: "Demo User"
output_dir: "./demo/demo_output"
save_images: true
save_metadata: true
save_sample_video: false

acquisition:
  num_samples: 200         # Number of frames to capture
  frame_rate: 30           # Target frame rate (Hz)
  z_stack: false
  z_planes: 1
  baseline_samples: 0
  save_structural_scan: "none"

subject:
  subject_id: "screenshot_demo"
  subject_type: "screen_capture"
  notes: "Demonstration of RGB screen capture with input stimulus"

dev_options:
  # prefill_wb_ops: false
  send_sms_on_completion: false