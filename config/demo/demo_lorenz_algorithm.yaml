# Lorenz Demo Algorithm Configuration
# Configures state extraction and trigger volume for closed-loop control

algorithm_type: "LorenzDemo"

# GUI disabled for this demo (could add 3D visualization later)
enable_gui: false
gui_mode: "neural_imaging"
save_algorithm_plot: true

# Core algorithm parameters
algorithm_params:

  # Real-time visualization flag
  visualize_real_time: true
  
  # Cooldown after stimulation (frames)
  stim_cooldown_frames: 10
  
  # No probabilistic modulation for this demo
  skip_stimulation_probability: 0.0
  delay_stimulation_probability: 0.0
  
  # Trigger volume in phase space (3D box)
  # Default: upper-right wing of attractor (x>0, y>0, z>25)
  trigger_x_min: -2
  trigger_x_max: 2
  trigger_y_min: -2
  trigger_y_max: 2
  trigger_z_min: 15
  trigger_z_max: 25
    
  # Stimulus perturbation vector [dx, dy, dz]
  perturbation: [0.1, 0.1, 0.1]
  
  # Not used for this algorithm
  stimulus_diameter_pixels: 10

# Stimulus parameters
stimulus_params:
  enabled: true
  randomize: false
  
  # Duration of state perturbation effect
  duration_frames_options: [20]
  duration_frames: 20
  
  # Intensity scales the perturbation magnitude
  intensity_percent_options: [1]
  intensity_percent: 1