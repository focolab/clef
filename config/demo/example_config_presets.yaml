# ============================================================================
# PRESET 1: Innovation Core with LDI-Polygon (most common setup)
# config/examples/hardware_invcore_ldi_polygon.yaml
# ============================================================================
backend: "pycromanager"
mm_config_path: "C:\\MMConfigs\\CSUW1-LDI-Polygon.cfg"
stim_interface: "InvCore-LDI-Polygon-640"
microscope_name: "innovation core spinning disk"

strobe_acquisition: false
use_static_stim_roi: false

polygon_calibration_path: "./res/peripherals/Mightex Polygon P1000/calibrations.json"

devices:
  camera:
    device_name: "Prime BSI"
    device_type: "camera"
    properties:
      Binning: 1

illumination_channels:
  - name: "488nm GFP"
    device: "DAC488"
    wavelength: 488
    power: 50.0
  - name: "561nm RFP"
    device: "DAC561" 
    wavelength: 561
    power: 50.0
  - name: "640nm Stim"
    device: "LDI"
    wavelength: 640
    power: 10.0

