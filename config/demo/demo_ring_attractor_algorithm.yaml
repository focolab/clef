# Ring Attractor Demo Algorithm Configuration

algorithm_type: "RingAttractorDemo"

# Algorithm-specific parameters
algorithm_params:
  # Real-time visualization
  visualize_real_time: true

  # Trajectory visualization
  fading_trajectory_samples: 100  # Number of points in trail

  # Stimulus control
  default_stim_intensity: 0  # Starting slider value (0-100%)
  stim_cooldown_frames: 50

  # Auto-trigger settings
  auto_stim_enabled: false  # Can be toggled in GUI
  auto_stim_theta_min: 0.0  # Trigger when theta in this range
  auto_stim_theta_max: 0.785  # ~π/4 radians (45°)

  skip_stimulation_probability: 0.0
  delay_stimulation_probability: 0.0

# Stimulus parameters
stimulus_params:
  enabled: true
  duration_frames_options: [20]
  intensity_percent_options: [50]

# GUI settings
gui_params:
  enable_gui: false
  gui_mode: "neural_imaging"
  save_algorithm_plot: true
