# Lorenz Demo Experiment Configuration

experiment_name: "lorenz_attractor_demo"
experimenter: "CLEF_Demo"
output_dir: "./demo_output/lorenz"
save_images: true
save_metadata: true
save_mip_video: false

# Acquisition parameters
acquisition:
  num_samples: 3000 
  frame_rate: null     # As fast as possible
  z_stack: false       # Single plane
  z_planes: 1
  z_start: 0.0
  z_end: 0.0
  z_step: 1.0
  baseline_frames: 0   # No baseline needed
  save_structural_scan: "none"

# Subject metadata
subject:
  subject_id: "lorenz_system"
  subject_type: "dynamical_system"
  genotype: "classic_parameters"
  treatment: null
  treatment_details:
    condition: "chaotic_regime"
    atr_concentration_uM: null
  orientation:
    nose: null
    vnc: null
  num_eggs: 0
  notes: "Lorenz attractor with o=10, p=28, b=8/3. Closed-loop perturbation demo."

# Development options
dev_options:
  prefill_wb_ops: false
  send_sms_on_completion: false

# Not used for Lorenz demo
input_recording_path: null
z_step_size_um: 1.0