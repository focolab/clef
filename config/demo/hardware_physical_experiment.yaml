# Experiment configuration for Brainalyzer hardware demo
experiment_name: "brainalyzer_hardware_demo"
experimenter: "CLEF_Demo"
output_dir: "./demo_output_hardware"
save_images: true
save_metadata: true
save_mip_video: false

# Acquisition parameters
acquisition:
  num_samples: 800  # ~80 seconds at 10fps
  frame_rate: null
  z_stack: true
  z_planes: 8
  z_start: -10.5
  z_end: 10.5
  z_step: 3.0
  baseline_samples: 0
  save_structural_scan: "none"

# Subject metadata
subject:
  subject_id: "demo_subject"
  subject_type: "C. elegans"
  genotype: "demo_strain"
  treatment: null
  treatment_details:
    condition: "hardware_validation"
    atr_concentration_uM: null
  orientation:
    nose: null
    vnc: null
  num_eggs: 0
  notes: "Hardware validation demo with LDI Polygon stimulus"

z_step_size_um: 3.0
input_recording_path: null

dev_options:
  prefill_wb_ops: false
  send_sms_on_completion: false
