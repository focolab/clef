# Experiment configuration for Brainalyzer hardware demo
experiment_name: "brainalyzer_hardware_demo"
experimenter: "CLEF_Demo"
output_dir: "./demo_output_hardware"
save_images: true
save_metadata: true
save_sample_video: false

# Acquisition parameters
acquisition:
  num_samples: 800  # ~80 seconds at 10fps
  z_planes: 12
  
  # THIS SHOULD BE IN HARDWARE or removed
  # z_stack: true # compute from if z-planes > 1
  # frame_rate: null
  # z_start: -10.5
  # z_end: 10.5
  # z_step: 3.0

  # this should be in algorithm or removed
  baseline_samples: 0 

  # this should be removed
  save_structural_scan: "none"

# Subject metadata
# FEWER REQUIRED FIELDS MORE EXTRA FIELDS FOR SUBJECT DETAILS
subject:
  subject_id: "demo_subject"
  subject_type: "C. elegans"
  genotype: "demo_strain"
  treatment: null
  treatment_details:
    condition: "hardware_validation"
    atr_concentration_uM: null
  orientation:
    nose: null
    vnc: null
  num_eggs: 0
  notes: "Hardware validation demo with LDI Polygon stimulus"

# THIS SHOULD BE ELSEWHERE
# z_step_size_um: 3.0
input_recording_path: null

dev_options:
  # prefill_wb_ops: false
  send_sms_on_completion: false
