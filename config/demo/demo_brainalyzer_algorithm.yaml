# Algorithm configuration for Brainalyzer demo
algorithm_type: "Brainalyzer"

# Algorithm parameters
algorithm_params:
  stim_cooldown_frames: 50
  skip_stimulation_probability: 0.0
  delay_stimulation_probability: 0.0
  stim_delay_frames_options: []
  stim_onset_list: []
  stimulus_diameter_pixels: 30

# Stimulus parameters
stimulus_params:
  enabled: true
  randomize: false

# GUI settings
gui_params:
  enable_gui: true
  gui_mode: "neural_imaging"
  save_algorithm_plot: true
  gui_screenshot_freq: 0
