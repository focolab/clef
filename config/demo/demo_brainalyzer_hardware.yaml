# Brainalyzer Demo Hardware Configuration
# Uses DummyBackend with TIFF file input for testing

backend: "dummy"
stim_interface: "dummy"
microscope_name: "demo_microscope"

# Dummy backend parameters
dummy_params:
  image_width: 200
  image_height: 200

# System devices configuration
system_devices:
  camera:
    device_name: "DummyCamera"
    device_type: "camera"
    properties:
      Exposure: 50.0
      Binning: "1x1"

  stage:
    device_name: "DummyStage"
    device_type: "stage"
    configs: {}
    properties: {}
    z_step_size_um: 2.5
    num_z_planes: 8

  # Illumination channels
  illumination_channels:
    - name: "dummy"
      device: "dummy"
      wavelength: null
      power: 50.0
      exposure_ms: 10.0

# System properties
system_properties:
  system_name: 'DummyMicroscope'
  auto_shutter: false
  circular_buffer_mb: 1000

# Stimulus device (dummy, no actual hardware)
stimulus_devices:
  dummy:
    type: "dummy"
    description: "Mock stimulus for testing"
