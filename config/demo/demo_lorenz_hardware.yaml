# Lorenz Demo Hardware Configuration
# Configures the Lorenz attractor backend with dynamical system parameters

backend: "lorenz_demo"
stim_interface: "lorenz"
microscope_name: "lorenz_attractor_sim"
strobe_acquisition: false

# Lorenz system parameters
lorenz_params:
  # Classic Lorenz attractor parameters
  sigma: 10.0      # Prandtl number
  rho: 28.0        # Rayleigh number  
  beta: 2.666667   # Geometric factor (8/3)
  dt: 0.01         # Integration time step
  
  # Initial conditions
  # initial_state: [1.0, 1.0, 1.0]  # [x, y, z]
  initial_state: [0.1, 0.1, 0.1]  # [x, y, z]
  
  # Image generation parameters
  image_width: 100
  image_height: 100
  noise_level: 100.0
  # noise_level: 0
  pixel_brightness: 50000.0
  pixel_radius: 2

# Stimulus device (not used for polygon/LED, just for metadata)
stimulus_devices:
  lorenz:
    type: "state_perturbation"
    description: "Perturbs Lorenz state variables"