# ========================================
# screenshot_algorithm.yaml
# ========================================
algorithm_type: "DisplayRGBAlgorithm"
enable_gui: false
gui_mode: "neural_imaging"
save_algorithm_plot: true

algorithm_params:
  # Visualization
  visualize_real_time: true
  
  # Trigger parameters
  trigger_enabled: false           # Set to true to enable input triggers
  trigger_color_threshold: 200     # Brightness threshold (0-255)
  stim_cooldown_frames: 30         # Frames between allowed stimuli
  
stimulus_params:
  enabled: false                   # Enable stimulus delivery
  randomize: false
  
  # Input event parameters
  keyboard_keys: ["space"]         # Keys to press on trigger
  mouse_action: "click"            # "click", "double_click", or "move"
  mouse_button: "left"             # "left", "right", or "middle"
  
  duration_frames: 5               # Not used for discrete inputs
  intensity_percent: 100           # Not used for inputs