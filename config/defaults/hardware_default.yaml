# CLEF Minimal Hardware Configuration
# Place this in: config/defaults/hardware_default.yaml

# Micro-Manager configuration (ignored for dummy backend)
backend_configuration:

  # Hardware backend selection
  backend_name: "dummy"  # Options: pycromanager, pymmcore, dummy

# configuration of stimulus hardware parameters
stimulus_configuration:

  # Stimulus interface class
  stim_interface: "dummy"  # Options: InvCoreLDIPolygon, InvCoreSpinningDisk639, dummy, etc.

# Stimulus device configuration
# Maps stimulus interface types to their hardware control parameters
stimulus_devices:

  # no op stimulus device
  dummy:
    type: "dummy"

# Device configurations
system_devices:

  # The system captures data with a camera
  camera:
    device_name: "Camera"
    device_type: "camera"
    properties:
      Exposure: 100.0
      Binning: 1
      
  # The system may be able to actuate the sample with a stage
  stage: null

  # Illumination channels
  illumination_channels:
    - name: "dummy"
      device: "dummy"
      wavelength: null
      power: 100.0
      exposure_ms: 100.0

# System-level Micro-Manager properties
system_properties:

  # Microscope name
  system_name: 'dummy'

  # Shutters
  auto_shutter: null  # null = don't set, true/false = set value
  circular_buffer_mb: null  # null = don't set, integer = buffer size in MB
  configs: {}  # Micro-Manager config group presets (e.g., {"Channel": "488"})
  shutters: []  # List of shutter states: [{"device_name": "LaserShutter", "state": true}]

