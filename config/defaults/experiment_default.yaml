# CLEF Minimal Experiment Configuration
# Place this in: config/defaults/experiment_default.yaml

# Experiment metadata
experiment_name: "default_experiment"
experimenter: "Unknown"
output_dir: "./data"
save_images: true
save_metadata: true
save_sample_video: false # experiments may want to save a summary plot

# Acquisition parameters
acquisition:
  num_samples: 100

# Subject metadata (generic, domain-agnostic)
subject:
  subject_id: null
  subject_type: null
  subject_details:
    treatment: null
    treatment_details:
      condition: null
    orientation: null
  notes: null

# Development options
dev_options: null