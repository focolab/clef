# Algorithm Configuration for CLEF
# This file defines closed-loop trigger algorithms and stimulus parameters
# Different algorithms can have different parameter sets

closed_loop:
  # Algorithm selection and mode
  algorithm:
    name: "Brainalyzer"  # Options: "Brainalyzer", "DummyAlg", etc.
    enabled: true  # Set to false to run open-loop (acquisition only)
    
  # GUI/visualization mode
  gui:
    mode: "neural_imaging"  # Options: "neural_imaging", "behavior"
    show_realtime_plot: true
    save_algorithm_plot: true  # Save visualization at end of experiment

  # Stimulus interface to use (must match hardware.yaml)
  stimulus:
    interface: "InvCore-LDI-Polygon-640"  # Must be in hardware.available list
    
    # Stimulus timing options
    duration_frames_options: [48]  # List of possible stimulus durations (frames)
    intensity_percent_options: [10]  # List of possible intensities (0-100%)
    
    # Stimulus region of interest (for spatial algorithms)
    roi:
      use_static_roi: false  # Upload fixed ROI at start
      static_roi_file: null  # Path to ROI mask (if use_static_roi=true)
      diameter_pixels: 10  # For point-based algorithms like PointAndClick
    
    # Stimulus timing rules
    timing:
      cooldown_frames: 900  # Refractory period after stimulus
      delay_probability: 0.4  # Probability of delaying stimulus
      skip_probability: 0.1  # Probability of skipping stimulus
      delay_options_frames: [200, 400]  # Possible delay durations

# ============================================================================
# ALGORITHM-SPECIFIC PARAMETERS
# Different algorithms require different parameter sets
# ============================================================================

algorithms:
  
  # Brainalyzer: Real-time neural activity analysis with GUI
  Brainalyzer:
    # Algorithm-specific params go here
    # Currently configured via GUI, but could be parameterized
    enable_gui_controls: true
    
  # DummyAlg: No-op algorithm for testing
  DummyAlg:
    # No parameters needed
    pass
  
  # Dynamic Range Derivative (legacy - needs refactoring)
  DynamicRangeDeriv:
    threshold_positive: 0.06  # Derivative threshold for trigger
    threshold_negative: 0.06  # Negative derivative threshold (absolute value)
    blob_detection:
      min_area: 10  # pixels
      max_area: 1000
      
  # ROI Derivative (legacy - needs refactoring)
  RoiDeriv:
    require_structural_scan: true  # Needs structural images for ROI selection
    motion_correction: true
    threshold_positive: 0.06
    threshold_negative: 0.06
    
  # Fixed Stimulus Timing (legacy - needs refactoring)
  StimOnsetFromList:
    onset_frames: []  # User-provided list of frames to trigger, e.g. [100, 500, 1000]
    
  # Point and Click (legacy - needs refactoring)
  PointAndClick:
    enable_motion_tracking: true
    click_radius_pixels: 10
    
  # Hammer of Dawn (legacy - needs refactoring)
  HammerOfDawn:
    continuous_tracking: true  # Follow cursor in real-time
    update_rate_hz: 30

