# Hardware Configuration for CLEF
# This file defines microscope hardware, devices, and their properties
# Users should create one hardware.yaml per physical microscope setup

hardware_profile:
  name: "innovation_core_spinning_disk"  # User-friendly identifier
  description: "Innovation Core confocal with ASI stage and Photometrics camera"

acquisition:
  backend: "pycromanager"  # Options: "pycromanager", "pymmcore", "MMCorePy"
  
  micromanager:
    config_file: "C:\\MMConfigs\\CSUW1-LDI-Polygon.cfg"
    install_path: "C:\\Program Files\\Micro-Manager-2.0"
    device_adapter_paths:
      - "C:\\Program Files\\Micro-Manager-2.0"
  
  camera:
    device_name: "PrimeBSI"  # MM device label
    properties:
      ExposeOutMode: "Rolling Shutter"
      Binning: "1x1"
    default_exposure_ms: 50
    buffer_size_mb: 10000
  
  stage:
    focus_device: "ZStage"  # MM device label for Z-axis
    xy_device: null  # Optional: "XYStage" if applicable
    properties:
      # ASI-specific stage settings if needed
      UseSequences: true
    serial:
      port: "COM6"  # ASI stage serial port
      baud_rate: 9600

  shutters:
    main_shutter:
      device_name: "LaserShutter"
      auto_shutter: false  # Disable auto-shutter for precise control
    
  triggering:
    # TriggerScope or similar synchronization hardware
    trigger_device: "TriggerScopeMM-Hub"
    laser_ttl_device: "TTL1-8"  # Device controlling laser blanking
    properties:
      UseActionLEDs: "Off"
      Blanking: "On"
      Sequence: "On"

illumination:
  # Laser lines and their control
  channels:
    - name: "405"
      device_name: "DAC405"
      property_name: "Volts"
      wavelength_nm: 405
      default_intensity: 0.0  # Volts
      max_intensity: 5.0
      
    - name: "488"
      device_name: "DAC488"
      property_name: "Volts"
      wavelength_nm: 488
      default_intensity: 0.0
      max_intensity: 5.0
      
    - name: "561"
      device_name: "DAC561"
      property_name: "Volts"
      wavelength_nm: 561
      default_intensity: 0.0
      max_intensity: 5.0
      
    - name: "639"
      device_name: "DAC639"
      property_name: "Volts"
      wavelength_nm: 639
      default_intensity: 0.0
      max_intensity: 5.0

  # Emission filter configurations (MM config groups)
  filter_configs:
    group_name: "Channel"  # MM config group
    presets:
      - name: "488"
        emission_filter: "525/50"
      - name: "488-605-70m"
        emission_filter: "605/70"
      - name: "561"
        emission_filter: "600LP"
      - name: "561-700-75m"
        emission_filter: "700/75"
      - name: "639"
        emission_filter: "690LP"

stimulus_interfaces:
  # Available stimulus hardware on this microscope
  available:
    - name: "InvCore-LDI-Polygon-640"
      type: "spatial_light_modulator"
      class: "InvCoreLDIPolygon"  # Python class to instantiate
      wavelength_nm: 640
      device_name: "Polygon1000"  # MM device if applicable
      calibration_file: "res/peripherals/Mightex_Polygon_P1000/calibrations.json"
      properties:
        max_intensity: 100  # percent
        
    - name: "InvCore-SpinningDisk-639"
      type: "widefield_laser"
      class: "InvCoreSpinningDisk639"
      wavelength_nm: 639
      laser_device: "DAC639"
      shutter_device: "LaserShutter"
      properties:
        max_intensity_volts: 5.0
        
    - name: "InvCore-ThunderscopeLED3"
      type: "led_array"
      class: "InvCoreThunderscopeLED3"
      device_name: "LED-Array"
      properties:
        num_leds: 3

calibrations:
  pixel_size_um: 0.108  # Microns per pixel at 1x1 binning
  objective: "60x/1.2 NA"
  
  # SLM/Polygon calibration for coordinate transforms
  polygon_calibration:
    reference_microscope_config: "CSUW1-LDI-Polygon.cfg"
    calibration_file: "res/peripherals/Mightex_Polygon_P1000/calibrations.json"
    # Calibration contains 3-point transform between image and polygon coordinates

