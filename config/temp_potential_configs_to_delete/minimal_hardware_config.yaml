# Minimal Hardware Configuration for CLEF Testing
# Bare-bones template showing only essential fields

hardware_profile:
  name: "test_microscope"

acquisition:
  backend: "dummy"  # Options: "dummy", "pycromanager", "pymmcore", "MMCorePy"
  
  # Only needed for real hardware
  micromanager:
    config_file: null
    install_path: null
  
  camera:
    device_name: "Camera"
    default_exposure_ms: 50
    buffer_size_mb: 1000
  
  # Optional: only if using Z-stack
  stage:
    focus_device: "ZStage"
    serial:
      port: null
      baud_rate: 9600

# Optional: only if doing illumination control
illumination:
  channels: []

# Required: at least one stimulus interface
stimulus_interfaces:
  available:
    - name: "DummyStim"
      type: "simulated"
      class: "DummyStim"

# Optional: microscope calibration
calibrations:
  pixel_size_um: 0.108
