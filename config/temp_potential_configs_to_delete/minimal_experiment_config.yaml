# Minimal Experiment Configuration for CLEF Testing
# Bare-bones template showing only essential fields

experiment:
  output:
    directory: "./test_output"
    save_images: false  # Set to false for fast testing
    save_metadata: true
  
  acquisition:
    total_frames: 100  # Short for testing
    baseline_frames: 0
    
  imaging:
    z_planes: 1  # Single plane for simplicity
    z_step_size_um: 3.0
    exposure_ms: 50
    binning: "1x1"
    roi: null  # null = full frame
  
  structural_scan:
    enabled: false  # Disable for basic testing

# Minimal subject metadata
subject:
  species: "test_sample"
  genotype: "test_strain"
  
notes: "Minimal test configuration"
