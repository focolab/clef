# CLEF Hardware Configuration for Torstoscope Spinning Disk
# This configuration replaces hardcoded device settings in MMSubroutines.py
# for scope == "torstoscope spinning disk"

# Hardware backend selection
backend: "pymmcore"  # Torstoscope uses pymmcore backend

# Micro-Manager configuration file path
# Update this path to match your Micro-Manager config file location
mm_config_path: "C:\\Program Files\\Micro-Manager-2.0beta\\20201016_PRIME_BSI_TIE.cfg"

# Stimulus interface class
# Common options: "LMM5_561", "Polygon1000_590", etc.
stim_interface: "LMM5_561"

# Microscope name (temporary, backward compatibility)
microscope_name: "torstoscope spinning disk"

# Device configurations
# Each device can have:
#   - properties: Device-specific properties set via mmc.setProperty()
#   - configs: Micro-Manager config group presets set via mmc.setConfig()
devices:
  camera:
    device_name: "PRIME BSI"
    device_type: "camera"
    properties:
      Binning: 1
      # Note: Exposure is typically set via CameraInterface methods
      # but can also be set here if needed
    configs: {}
  
  # LMM5 laser configuration
  # These configs are applied when stim_interface == "LMM5_561"
  lmm5:
    device_name: "LMM5"
    device_type: "laser"
    properties: {}
    configs:
      LMM5: "488+561"  # Config group preset for dual wavelength
      "LMM5-561-intensity": "0"  # Start with 561 at zero intensity

# System-level Micro-Manager properties
# These control global Micro-Manager settings
system_properties:
  # Auto shutter: false = manual control, true = automatic
  auto_shutter: false
  
  # Circular buffer size in MB
  circular_buffer_mb: 10000
  
  # Shutter states to set during initialization
  shutters:
    - device_name: "LMM5-Shutter"
      state: true  # true = open, false = closed

# Strobe settings
strobe_acquisition: false
strobe_inter_frame_interval_ms: 80

# Static ROI
use_static_stim_roi: false

# Illumination channels
illumination_channels: []

# Calibration files
polygon_calibration_path: null

# Note: Config presets from args["configs"] in prepare_live_acquisition()
# are deprecated and should be migrated to devices[].configs above.
# For backward compatibility, they may still be applied from args during
# acquisition setup, but device initialization uses this config file.

