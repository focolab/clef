# Recording Playback Logic Configuration
# Brainalyzer GUI with playback data

logic_algorithms:
  - logic_algorithm_name: "brainalyzer"
    logic_class: "brainalyzer_logic"
    logic_parameters:
      gui_mode: "neural_imaging"
      stim_intensity: 0
      zsize: 8
      input_device_name: "camera"
      save_dir: "./demo_output/recording_playback"
    io_parameters:
      output_device_names: []
    gui_parameters:
      gui_screenshot_freq: 0
