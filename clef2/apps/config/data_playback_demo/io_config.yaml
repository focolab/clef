# Data Playback Demo IO Configuration
# Plays back a saved TIFF file as though it were live camera input

input_devices:
  - input_device_name: "playback_camera"
    input_device_type: "demo"
    input_device_class: "tiff_playback_input"
    data_interface_class: "uint16_data_interface"
    input_device_parameters:
      # Users should update this path to their own TIFF file
      tiff_path: "C:/Users/rldun/Desktop/temp_render/example_data/20221106-21-47-31/20221106-21-47-1_minified_8z_100t.tif"
      exposure_ms: 10.0
      loop: true

output_devices: []
